<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3b1a12">
<title>Painel — Docinhos da Gigi</title>
<meta name="description" content="Painel interno da Docinhos da Gigi: pedidos, cardápio e ajustes da loja.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<main id="login-view" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="on" novalidate>
    <h1>Docinhos da Gigi</h1>
    <p class="muted">Painel de pedidos e cardápio</p>
    <label class="field"><span>Usuário</span>
      <input id="login-user" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="64" required>
    </label>
    <label class="field"><span>Senha</span>
      <input id="login-pass" name="password" type="password" autocomplete="current-password" maxlength="256" required>
    </label>
    <p id="login-error" class="error" role="alert" hidden></p>
    <button id="login-submit" class="btn primary block" type="submit">Entrar</button>
    <button id="login-forgot" class="btn block" type="button">Esqueci a senha</button>
  </form>
</main>

<div id="app" hidden>
  <header class="topbar">
    <h1>Docinhos da Gigi</h1>
    <span id="store-badge" class="badge warn" hidden>Loja fechada</span>
  </header>
  <button id="weak-banner" class="weak" type="button" hidden>Sua senha é fraca. Troque agora em Conta.</button>
  <main id="view" class="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Seções do painel">
    <button type="button" data-tab="orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>Pedidos</span><i id="orders-dot" class="dot" hidden></i></button>
    <button type="button" data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg><span>Histórico</span></button>
    <button type="button" data-tab="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>Cardápio</span></button>
    <button type="button" data-tab="pause"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg><span>Pausa</span></button>
    <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Ajustes</span></button>
    <button type="button" data-tab="account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>Conta</span></button>
  </nav>
</div>

<div id="overlay-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/admin/admin.js"></script>
<script src="/admin/admin-orders.js"></script>
<script src="/admin/admin-product.js"></script>
<script src="/admin/admin-menu.js"></script>
<script src="/admin/admin-pause.js"></script>
<script src="/admin/admin-store.js"></script>
<script src="/admin/admin-history.js"></script>
<script src="/admin/admin-settings.js"></script>
</body>
</html>
